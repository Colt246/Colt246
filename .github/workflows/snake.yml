name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ffb547&color_dots=#16213a,#0e4429,#006d32,#26a641,#3dff9a

      # Le pone un panel oscuro propio para que se vea igual con GitHub en modo claro u oscuro
      - name: Añadir fondo oscuro
        run: |
          python3 - <<'PY'
          import re
          p = "dist/github-snake.svg"
          s = open(p, encoding="utf-8").read()
          x, y, w, h = map(float, re.search(r'viewBox="([^"]+)"', s).group(1).split())
          pad = 16
          rect = (f'<rect x="{x-pad}" y="{y-pad}" width="{w+2*pad}" height="{h+2*pad}" '
                  f'rx="18" fill="#0a1020" stroke="#1f3352" stroke-width="2"/>')
          s = re.sub(r'viewBox="[^"]+"', f'viewBox="{x-pad} {y-pad} {w+2*pad} {h+2*pad}"', s, count=1)
          s = re.sub(r'(<svg[^>]*>)', r'\1' + rect, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
